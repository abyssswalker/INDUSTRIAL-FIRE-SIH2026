services:
  - type: web
    name: industrial-fire-sih2026
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
