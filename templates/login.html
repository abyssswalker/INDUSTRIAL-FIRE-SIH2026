{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width:500px;">
        <h2 class="text-center mb-4">Login</h2>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">
                    Login
                </button>
            </div>
        </form>

        <hr>

        <p class="text-center">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">
                Register Here
            </a>
        </p>
    </div>
</div>
{% endblock %}
