<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cluster Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .page-wrapper {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      padding: 12px 16px;
      background: #0f172a;
      color: #fff;
    }

    .page-header h1 {
      margin: 0;
      font-size: 22px;
    }

    .page-header p {
      margin: 4px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="page-header">
      <h1>Industrial Fire Cluster Map</h1>
      <p>Viewing cluster hotspots and labels from the database</p>
    </div>

    <div id="map">
      <div id="loading" class="loading-overlay">Loading hotspots…</div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Pass API URLs from FastAPI into JS -->
  <script>
    window.APP_CONFIG = {
      hotspotsUrl: "{{ url_for('read_hotspots') }}",
      statsUrl: "{{ url_for('read_stats') }}"
    };
  </script>

  <!-- Your map logic -->
  <script src="{{ url_for('static', path='js/map.js') }}"></script>
</body>
</html>
