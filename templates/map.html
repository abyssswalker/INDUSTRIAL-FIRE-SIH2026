<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cluster Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .page-wrapper {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      padding: 12px 16px;
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .page-header h1 {
      margin: 0;
      font-size: 22px;
    }

    .page-header p {
      margin: 4px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="page-header">
      <h1>Industrial Fire Cluster Map</h1>
      <p>Viewing cluster hotspots and labels from the database</p>
    </div>

    <div id="map"></div>
  </div>

  <script>
    window.APP_CONFIG = {
      hotspotsUrl: "{{ url_for('read_hotspots') }}",
      statsUrl: "{{ url_for('read_stats') }}"
    };
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', path='js/map.js') }}"></script>
</body>
</html>
